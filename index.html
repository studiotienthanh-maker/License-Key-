<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#101a24">
  <title>Tạo License Key | Tiến Adobe 5.0</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101a24; color: #eaf2f6; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 920px; margin: auto; padding: clamp(20px, 5vw, 56px) clamp(14px, 4vw, 30px); }
    header p { color: #86dcca; margin: 0; font-weight: 650; }
    h1 { font-size: clamp(30px, 6vw, 48px); margin: 4px 0 22px; line-height: 1.12; }
    h2 { font-size: 20px; margin: 0 0 16px; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
    .panel { min-width: 0; padding: clamp(16px, 3vw, 24px); border: 1px solid #354856; border-radius: 16px; background: #192735; }
    fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
    label { display: block; font-weight: 650; margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    input, select, textarea, button { width: 100%; min-height: 48px; border-radius: 9px; font: inherit; }
    input, select, textarea { background: #101a24; color: inherit; border: 1px solid #516474; padding: 10px 12px; color-scheme: dark; }
    input[type=file] { padding: 7px; }
    input::file-selector-button { margin-right: 8px; border: 0; border-radius: 6px; background: #334b5a; color: #fff; padding: 7px 10px; }
    textarea { min-height: 112px; resize: vertical; overflow-wrap: anywhere; }
    button { padding: 9px 12px; border: 1px solid #536b79; background: #253c49; color: #eaf2f6; cursor: pointer; font-weight: 700; }
    button:disabled { opacity: .55; cursor: default; }
    #generate { margin-top: 18px; background: #8ce3cb; color: #10271f; border-color: transparent; }
    :focus-visible { outline: 2px solid #98efdc; outline-offset: 2px; }
    .hint, dt { color: #becdd6; font-size: .875rem; }
    .hint { margin: 6px 0 0; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    #status { color: #ffdfa4; margin: 12px 0 0; }
    #status:empty { display: none; }
    dl { display: grid; gap: 8px; margin: 14px 0 0; padding-top: 14px; border-top: 1px solid #354856; }
    dl div { display: flex; justify-content: space-between; gap: 10px; }
    dd { margin: 0; text-align: right; }
    @media (max-width: 700px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p>Ảnh Hồ Sơ AI Tiến Adobe 5.0</p>
      <h1>Tạo License Key</h1>
    </header>
    <div class="layout">
      <form class="panel" id="license-form">
        <h2>Thông tin cấp phép</h2>
        <fieldset id="inputs">
          <label for="device">Mã máy của khách (Device ID)</label>
          <input id="device" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Dán mã 32 ký tự từ phần mềm Windows" required>
          <label for="customer">Tên khách hàng</label>
          <input id="customer" autocomplete="off" maxlength="100" required>
          <label for="days">Thời hạn sử dụng</label>
          <select id="days">
            <option value="7">7 ngày</option>
            <option value="30">30 ngày</option>
            <option value="90">90 ngày</option>
            <option value="180">180 ngày</option>
            <option value="365" selected>365 ngày</option>
            <option value="forever">Vĩnh viễn</option>
          </select>
          <label for="signing-key">Tệp khóa ký của bạn</label>
          <input id="signing-key" type="file" accept=".pem" aria-describedby="signing-help signing-status" required>
          <p class="hint" id="signing-help">Chọn private-key.pem từ bộ tạo key Windows. Trình duyệt dùng tệp này để ký ngay trên thiết bị.</p>
          <p class="hint" id="signing-status">Chưa chọn tệp khóa ký</p>
        </fieldset>
        <button id="generate" type="submit">Tạo License Key</button>
      </form>
      <section class="panel" aria-labelledby="output-heading">
        <h2 id="output-heading">License Key đã tạo</h2>
        <textarea id="key" aria-labelledby="output-heading" readonly spellcheck="false" placeholder="Key sẽ xuất hiện tại đây"></textarea>
        <div class="actions">
          <button id="copy" type="button" disabled>Sao chép key</button>
          <button id="save" type="button" disabled>Tải tệp TXT</button>
        </div>
        <p id="status" role="status"></p>
        <dl>
          <div><dt>Ngày cấp</dt><dd id="start">—</dd></div>
          <div><dt>Hết hạn</dt><dd id="expiry">—</dd></div>
        </dl>
      </section>
    </div>
  </main>
  <script>
const $ = id => document.getElementById(id);
const date = value => new Intl.DateTimeFormat('vi-VN', {
  dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Ho_Chi_Minh'
}).format(value);
const encoder = new TextEncoder();
const publicKeyDer = 'MCowBQYDK2VwAyEAnOGc5fPWuIhPk71tKCP/fXjsNVFYP5lXPW/mounBf7E=';
const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
const base64url = value => btoa(String.fromCharCode(...new Uint8Array(value)))
  .replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');

function clearLicense() {
  $('key').value = '';
  $('copy').disabled = true;
  $('save').disabled = true;
  $('status').textContent = '';
  $('start').textContent = '—';
  $('expiry').textContent = '—';
}

$('signing-key').addEventListener('change', () => {
  clearLicense();
  $('signing-status').textContent = $('signing-key').files[0]
    ? 'Đã chọn tệp khóa ký' : 'Chưa chọn tệp khóa ký';
});

for (const id of ['device', 'customer', 'days']) {
  $(id).addEventListener('input', clearLicense);
}

$('license-form').addEventListener('submit', async event => {
  event.preventDefault();
  clearLicense();
  const device = $('device').value.trim().toUpperCase();
  const customer = $('customer').value.trim();
  const file = $('signing-key').files[0];
  const term = $('days').value;
  const days = term === 'forever' ? null : Number(term);
  if (!/^[0-9A-F]{32}$/.test(device)) {
    $('status').textContent = 'Mã máy phải có 32 ký tự HEX (0–9, A–F). Hãy sao chép mã máy từ phần mềm Windows.';
    return;
  }
  if (!customer || !file) {
    $('status').textContent = 'Vui lòng nhập tên khách hàng và chọn tệp private-key.pem.';
    return;
  }
  if (days !== null && ![7, 30, 90, 180, 365].includes(days)) {
    $('status').textContent = 'Thời hạn không hợp lệ.';
    return;
  }
  $('generate').disabled = true;
  $('inputs').disabled = true;
  try {
    const pem = (await file.text()).trim();
    const match = /^-----BEGIN PRIVATE KEY-----\s+([A-Za-z0-9+/=\s]+)-----END PRIVATE KEY-----$/.exec(pem);
    if (!match) throw new Error('invalid PEM');
    const algorithm = 'Ed25519';
    const privateKey = await crypto.subtle.importKey(
      'pkcs8', bytes(match[1].replace(/\s/g, '')), algorithm, false, ['sign']
    );
    const publicKey = await crypto.subtle.importKey(
      'spki', bytes(publicKeyDer), algorithm, false, ['verify']
    );
    const issuedAt = Date.now();
    const expiresAt = days === null ? null : issuedAt + days * 86400000;
    const payload = {
      product: 'anh-ho-so-ai-5.0', device, issuedAt, expiresAt,
      licenseId: crypto.randomUUID(), customer
    };
    const encoded = base64url(encoder.encode(JSON.stringify(payload)));
    const message = encoder.encode(encoded);
    const signature = await crypto.subtle.sign(algorithm, privateKey, message);
    if (!await crypto.subtle.verify(algorithm, publicKey, signature, message)) {
      $('status').textContent = 'Tệp khóa ký không khớp với bản Windows 5.0.';
      return;
    }
    $('key').value = encoded + '.' + base64url(signature);
    $('start').textContent = date(new Date(issuedAt));
    $('expiry').textContent = expiresAt === null ? 'Vĩnh viễn' : date(new Date(expiresAt));
    $('signing-status').textContent = 'Đã xác minh khóa ký';
    $('copy').disabled = false;
    $('save').disabled = false;
    $('status').textContent = 'Đã tạo License Key cho ' + customer + '.';
  } catch (error) {
    $('status').textContent = !globalThis.crypto?.subtle || error.name === 'NotSupportedError'
      ? 'Trình duyệt chưa hỗ trợ ký Ed25519. Hãy thử phiên bản trình duyệt mới hơn.'
      : 'Không đọc được khóa ký. Hãy chọn tệp private-key.pem từ bộ tạo key Windows.';
  } finally {
    $('generate').disabled = false;
    $('inputs').disabled = false;
  }
});
$('copy').addEventListener('click', async () => {
  const key = $('key');
  if (!key.value) return;
  try {
    await navigator.clipboard.writeText(key.value);
    $('status').textContent = 'Đã sao chép License Key.';
  } catch {
    key.focus();
    key.select();
    $('status').textContent = 'Đã chọn toàn bộ key. Hãy dùng lệnh Sao chép của thiết bị.';
  }
});

$('save').addEventListener('click', () => {
  const token = $('key').value;
  if (!token) return;
  const blob = new Blob([token], {type: 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'Tien-Adobe-License.txt';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
